<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-labelledby="t d">
  <title id="t">Coach Claude</title>
  <desc id="d">A training system for endurance athletes: computed training load, measured execution, and an AI coach that plans inside the numbers.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e4620"/>
      <stop offset="0.55" stop-color="#2c5f2d"/>
      <stop offset="1" stop-color="#4a7c7e"/>
    </linearGradient>
    <linearGradient id="mist" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f5f0" stop-opacity="0"/>
      <stop offset="1" stop-color="#f5f5f0" stop-opacity="0.10"/>
    </linearGradient>
    <!-- Douglas fir: drooping tiers on a narrow cone, unit height 64 -->
    <symbol id="fir" viewBox="0 0 64 64" preserveAspectRatio="none" overflow="visible">
      <rect x="30" y="52" width="4" height="12" fill="currentColor"/>
      <path fill="currentColor" d="M32 0 L37 10 Q34.5 9 32 9.8 Q29.5 9 27 10 Z
        M32 6 L41 19 Q36.5 17.4 32 18.4 Q27.5 17.4 23 19 Z
        M32 14 L45 30 Q38.5 27.6 32 28.8 Q25.5 27.6 19 30 Z
        M32 23 L49 42 Q40.5 39 32 40.4 Q23.5 39 15 42 Z
        M32 33 L53 55 Q42.5 51.6 32 53 Q21.5 51.6 11 55 Z"/>
    </symbol>
  </defs>

  <rect width="1280" height="340" rx="18" fill="url(#sky)"/>

  <!-- distant ridge -->
  <path d="M0 250 L120 205 L210 232 L330 170 L450 228 L560 196 L690 240 L800 188 L930 226 L1050 176 L1180 214 L1280 196 L1280 340 L0 340 Z"
        fill="#f5f5f0" fill-opacity="0.07"/>
  <path d="M0 280 L140 246 L260 266 L400 230 L540 262 L660 240 L800 270 L940 238 L1080 262 L1200 244 L1280 256 L1280 340 L0 340 Z"
        fill="#1e4620" fill-opacity="0.45"/>
  <rect width="1280" height="340" rx="18" fill="url(#mist)"/>

  <!-- back row of firs (teal, hazy); every tree's base sits on the ground line (y ~ 310) -->
  <g color="#4a7c7e" opacity="0.6">
    <use xlink:href="#fir" x="862" y="206" width="64" height="106"/>
    <use xlink:href="#fir" x="958" y="160" width="92" height="152"/>
    <use xlink:href="#fir" x="1090" y="128" width="112" height="184"/>
    <use xlink:href="#fir" x="1214" y="196" width="68" height="116"/>
  </g>
  <!-- front row (cream) -->
  <g color="#f5f5f0">
    <use xlink:href="#fir" x="1000" y="84" width="140" height="230"/>
    <use xlink:href="#fir" x="912" y="190" width="76" height="124"/>
    <use xlink:href="#fir" x="1150" y="168" width="90" height="146"/>
    <use xlink:href="#fir" x="1232" y="236" width="46" height="78"/>
  </g>
  <!-- ground line -->
  <rect x="0" y="306" width="1280" height="34" fill="#1e4620" fill-opacity="0.55"/>

  <!-- wordmark -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#f5f5f0">
    <text x="64" y="128" font-size="74" font-weight="700" letter-spacing="-1.5">Coach Claude</text>
    <text x="68" y="174" font-size="22" font-weight="500" fill-opacity="0.92">Computed training load · measured execution · an AI coach that plans inside the numbers</text>
    <g font-size="15" font-weight="600" letter-spacing="2.2" fill="#d4b088">
      <text x="68" y="232">CTL / ATL / TSB · PERIODIZATION · ERG EXECUTION SCORING · READINESS</text>
    </g>
    <text x="68" y="286" font-size="15" font-weight="500" fill-opacity="0.75">Built and ridden in the Pacific Northwest</text>
  </g>
</svg>
