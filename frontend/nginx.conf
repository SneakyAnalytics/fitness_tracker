server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # FastAPI (strip the /api prefix, like the Vite dev proxy does)
    location /api/ {
        proxy_pass http://fastapi:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Coach replies stream as Server-Sent Events; don't buffer them.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # Client-side routes
    location / {
        try_files $uri /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
